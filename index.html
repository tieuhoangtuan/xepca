<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Đăng ký ca làm việc</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --green:#06C755; --green-dark:#05A948; --green-soft:#E8F8EE;
    --ink:#1A1A1A; --muted:#8A8F98; --line:#E5E7EB; --bg:#FFFFFF;
    --warn:#B45309; --warn-bg:#FEF3C7;
    --ok:#166534; --ok-bg:#DCFCE7;
    --no:#991B1B; --no-bg:#FEE2E2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    font-size:15px;line-height:1.45;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 120px}

  #loading{min-height:100vh;display:flex;flex-direction:column;
           align-items:center;justify-content:center;padding:24px;gap:14px}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--green);
        border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loadTxt{color:var(--muted);font-size:14px}
  #diag{width:100%;max-width:520px;text-align:left;font-size:12.5px;line-height:1.85;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
        background:#FAFAFA;border:1px solid var(--line);border-radius:10px;
        padding:12px 14px;margin-top:6px}
  #diag div{word-break:break-word}
  .s-run{color:var(--muted)} .s-ok{color:var(--ok)} .s-err{color:var(--no);font-weight:600}
  #hint{max-width:520px;font-size:13px;color:var(--warn);background:var(--warn-bg);
        border-radius:9px;padding:11px 13px;display:none;line-height:1.55}

  header{padding:20px 0 12px}
  h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
  .who{font-size:13px;color:var(--muted);margin-top:3px}

  .tabs{display:flex;gap:4px;background:#F3F4F6;padding:4px;border-radius:10px;margin:14px 0 18px}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:7px;font-size:14px;
       font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;border:none;
       background:none;font-family:inherit}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  label.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);
            margin:0 0 7px;text-transform:uppercase;letter-spacing:.4px}
  input[type=date],textarea{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;color:var(--ink);background:#fff;outline:none;
  }
  input[type=date]:focus,textarea:focus{border-color:var(--green)}
  textarea{resize:none;min-height:84px;line-height:1.5}
  .sec{margin-bottom:22px}

  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .cnt{font-size:13px;color:var(--muted)}
  .cnt b{color:var(--green-dark)}
  .mini{font-size:13px;font-weight:600;color:var(--green-dark);
        background:none;border:none;padding:4px 2px;cursor:pointer;font-family:inherit}
  .row{
    display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:9px;
    border:1.5px solid var(--line);border-radius:11px;cursor:pointer;
    transition:background .12s,border-color .12s;user-select:none;
  }
  .row.on{border-color:var(--green);background:var(--green-soft)}
  .box{
    width:22px;height:22px;flex:0 0 22px;border:2px solid #CBD5E1;border-radius:6px;
    display:flex;align-items:center;justify-content:center;transition:.12s;
  }
  .row.on .box{background:var(--green);border-color:var(--green)}
  .box svg{width:13px;height:13px;opacity:0;transition:.12s}
  .row.on .box svg{opacity:1}
  .nm{font-weight:600;font-size:15px}
  .tm{font-size:13px;color:var(--muted);margin-left:auto}

  .foot{
    position:fixed;left:0;right:0;bottom:0;background:#fff;
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .foot .inner{max-width:520px;margin:0 auto}
  .btn{
    width:100%;padding:15px;border:none;border-radius:11px;background:var(--green);
    color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .btn:disabled{background:#D1D5DB;cursor:not-allowed}
  .btn:active:not(:disabled){background:var(--green-dark)}

  .card{border:1.5px solid var(--line);border-radius:11px;padding:14px;margin-bottom:11px}
  .card h3{margin:0 0 3px;font-size:15px;font-weight:700}
  .card .rid{font-size:12px;color:var(--muted);margin-bottom:10px}
  .it{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .p-w{background:var(--warn-bg);color:var(--warn)}
  .p-o{background:var(--ok-bg);color:var(--ok)}
  .p-n{background:var(--no-bg);color:var(--no)}
  .note{font-size:12px;color:var(--muted);margin-top:6px;padding-left:2px}
  .empty{text-align:center;color:var(--muted);padding:52px 20px;font-size:14px}

  #done{display:none;text-align:center;padding:70px 24px}
  .tick{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;
        background:var(--green-soft);display:flex;align-items:center;justify-content:center}
  #done h2{margin:0 0 8px;font-size:20px}
  #done p{margin:0 0 4px;color:var(--muted);font-size:14px}
  .code{display:inline-block;margin-top:14px;padding:7px 14px;background:#F3F4F6;
        border-radius:7px;font-size:13px;font-weight:700;letter-spacing:.5px}

  .err{background:var(--no-bg);color:var(--no);padding:11px 13px;border-radius:9px;
       font-size:13.5px;margin-bottom:14px;display:none}
  .hide{display:none !important}
</style>
</head>
<body>

<div id="loading">
  <div class="spin" id="spin"></div>
  <div id="loadTxt">Đang kết nối LINE…</div>
  <div id="hint"></div>
  <div id="diag" class="hide"></div>
</div>

<div id="app" class="hide">
  <div class="wrap">
    <header>
      <h1>Đăng ký lịch làm việc</h1>
      <div class="who" id="who"></div>
    </header>

    <div class="tabs">
      <button class="tab" data-tab="shift">Đăng ký ca</button>
      <button class="tab" data-tab="off">Xin OFF</button>
      <button class="tab" data-tab="hist">Lịch sử</button>
    </div>

    <div id="err" class="err"></div>

    <div id="formView">
      <div class="sec">
        <label class="fld" id="dateLbl">Chọn ngày</label>
        <input type="date" id="date">
      </div>

      <div class="sec" id="shiftSec">
        <div class="bar">
          <label class="fld" style="margin:0">Chọn ca</label>
          <button class="mini" id="toggleAll">Chọn tất cả</button>
        </div>
        <div id="rows"></div>
        <div class="cnt" id="cnt" style="margin-top:10px"></div>
      </div>

      <div class="sec">
        <label class="fld" id="reasonLbl">Ghi chú</label>
        <textarea id="reason" maxlength="300"></textarea>
      </div>
    </div>

    <div id="histView" class="hide">
      <div id="histBody"><div class="empty">Đang tải…</div></div>
    </div>
  </div>

  <div class="foot" id="foot">
    <div class="inner"><button class="btn" id="submit">Gửi yêu cầu</button></div>
  </div>
</div>

<div id="done">
  <div class="tick">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#06C755" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h2>Đã gửi yêu cầu</h2>
  <p id="doneMsg"></p>
  <p>Trạng thái: <b>Chờ duyệt</b></p>
  <div class="code" id="doneCode"></div>
</div>

<script>
/* ============================================================
   ⚠️ DÁN URL /exec CỦA APPS SCRIPT VÀO ĐÂY
   Lấy tại: Apps Script > Deploy > Manage deployments > Web app URL
   ============================================================ */
var GAS_URL = "https://script.google.com/macros/s/AKfycbxQDDm5o57SiwGwrQmoG3AwHRydWW26D2rCYLGaVXHUyFwmYuyOahGN7_jQ6RKlOByo/exec";

// Đặt false khi mọi thứ đã chạy ổn
var DEBUG = false;

var LIFF_ID  = null;
var SHIFTS   = [];
var MAX_DAYS = 60;
var MODE     = (location.search.indexOf("mode=off") >= 0) ? "off" : "shift";

var idToken    = null;
var picked     = [];
var tab        = MODE;
var histLoaded = false;

function $(id) { return document.getElementById(id); }

/* ==================== GỌI API ==================== */
/**
 * Thử POST trước (nhanh, gọn). Nếu trình duyệt chặn CORS thì
 * tự chuyển sang JSONP — cách này không bao giờ bị chặn.
 */
function api(name, data) {
  var body = Object.assign({ api: name }, data || {});
  return fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify(body)   // để text/plain, tránh preflight
  })
    .then(function (r) { return r.json(); })
    .catch(function () { return jsonp(name, data); });
}

var jsonpSeq = 0;
function jsonp(name, data) {
  return new Promise(function (resolve, reject) {
    var cb = "__cb" + (++jsonpSeq) + "_" + Date.now();
    var timer = setTimeout(function () { cleanup(); reject(new Error("Hết thời gian chờ máy chủ")); }, 20000);

    function cleanup() {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }

    window[cb] = function (res) { cleanup(); resolve(res); };

    var url = GAS_URL + "?api=" + encodeURIComponent(name) + "&callback=" + cb;
    if (data) url += "&payload=" + encodeURIComponent(JSON.stringify(data));

    var s = document.createElement("script");
    s.src = url;
    s.onerror = function () { cleanup(); reject(new Error("Không gọi được máy chủ")); };
    document.head.appendChild(s);
  });
}

/* ==================== CHẨN ĐOÁN ==================== */

var steps = [];
function push(txt, state) { steps.push({ t: txt, s: state || "run" }); render(); return steps.length - 1; }
function mark(i, state, txt) { if (steps[i]) { steps[i].s = state; if (txt) steps[i].t = txt; } render(); }
function render() {
  if (!DEBUG) return;
  $("diag").classList.remove("hide");
  var html = "";
  steps.forEach(function (x) {
    var m = x.s === "ok" ? "✓" : (x.s === "err" ? "✗" : "…");
    html += '<div class="s-' + x.s + '">' + m + " " + x.t + "</div>";
  });
  $("diag").innerHTML = html;
}
function stop(hintText) {
  $("spin").classList.add("hide");
  $("loadTxt").textContent = "Không kết nối được";
  if (hintText) { $("hint").innerHTML = hintText; $("hint").style.display = "block"; }
  render();
}

var TIMEOUT = setTimeout(function () {
  push("Quá 20 giây, dừng chờ", "err");
  push("URL: " + location.href, "err");
  stop("Kiểm tra lại GAS_URL ở đầu file index.html và quyền deploy của Apps Script.");
}, 20000);

/* ==================== KHỞI ĐỘNG ==================== */

push("Trang đã tải", "ok");
push("LIFF SDK: " + (typeof liff !== "undefined" ? "đã nạp" : "KHÔNG NẠP ĐƯỢC"),
     typeof liff !== "undefined" ? "ok" : "err");
push("Trong iframe: " + (window.self !== window.top ? "CÓ" : "không"), "ok");
push("Query: " + (location.search || "(trống)"), "ok");

if (typeof liff === "undefined") {
  clearTimeout(TIMEOUT);
  stop("Không tải được LIFF SDK. Kiểm tra mạng hoặc tường lửa chặn line-scdn.net.");
} else if (GAS_URL.indexOf("DAN_") === 0) {
  clearTimeout(TIMEOUT);
  push("GAS_URL chưa được điền", "err");
  stop("Mở index.html, dán URL <b>/exec</b> của Apps Script vào biến <b>GAS_URL</b>.");
} else {
  var iCfg = push("Đang lấy cấu hình từ Apps Script...");
  api("config")
    .then(function (cfg) {
      if (!cfg || !cfg.liffId) throw new Error("Máy chủ trả về dữ liệu rỗng");
      if (String(cfg.liffId).indexOf("DAN_") === 0) throw new Error("LIFF_ID trong Code.gs chưa điền");
      mark(iCfg, "ok", "Cấu hình OK — LIFF ID " + cfg.liffId);
      LIFF_ID  = cfg.liffId;
      SHIFTS   = cfg.shifts || [];
      MAX_DAYS = cfg.maxDays || 0;
      initLiff();
    })
    .catch(function (e) {
      clearTimeout(TIMEOUT);
      mark(iCfg, "err", "Lỗi cấu hình: " + e.message);
      stop("Kiểm tra: GAS_URL đúng chưa, Apps Script deploy với <b>Who has access = Anyone</b> chưa, " +
           "và đã điền LIFF_ID trong Code.gs chưa.");
    });
}

function initLiff() {
  var iInit = push("Đang gọi liff.init()...");

  liff.init({ liffId: LIFF_ID })
    .then(function () {
      mark(iInit, "ok", "liff.init() OK");
      push("isInClient: " + liff.isInClient() + " | isLoggedIn: " + liff.isLoggedIn(), "ok");

      if (!liff.isLoggedIn()) {
        push("Chưa đăng nhập, đang chuyển sang LINE Login...", "run");
        liff.login({ redirectUri: location.href });
        return null;
      }

      idToken = liff.getIDToken();
      if (!idToken) {
        clearTimeout(TIMEOUT);
        push("getIDToken() trả về NULL", "err");
        stop("LIFF app thiếu scope <b>openid</b>. Vào LINE Developers > LIFF > Scopes, " +
             "bật cả <b>profile</b> và <b>openid</b>, rồi mở lại.");
        return null;
      }
      push("getIDToken OK (" + idToken.length + " ký tự)", "ok");

      var iProf = push("Đang lấy profile...");
      return liff.getProfile().then(function (p) {
        mark(iProf, "ok", "Profile: " + p.displayName);
        return p;
      });
    })
    .then(function (p) {
      if (!p) return;
      clearTimeout(TIMEOUT);
      $("who").textContent = p.displayName;
      start();
    })
    .catch(function (e) {
      clearTimeout(TIMEOUT);
      var msg = (e && e.message) ? e.message : String(e);
      mark(iInit, "err", "liff lỗi: " + msg);
      if (e && e.code) push("Mã lỗi: " + e.code, "err");
      stop("Thường do LIFF ID sai, hoặc Endpoint URL trong LIFF app không trùng " +
           "địa chỉ GitHub Pages đang mở.");
    });
}

/* ==================== GIAO DIỆN ==================== */

function start() {
  buildRows();
  setupDate();
  bindTabs();
  setTab(tab);
  $("loading").classList.add("hide");
  $("app").classList.remove("hide");
}

function setupDate() {
  var iso = function (d) {
    return d.getFullYear() + "-" +
           ("0" + (d.getMonth() + 1)).slice(-2) + "-" +
           ("0" + d.getDate()).slice(-2);
  };
  var t = new Date();
  $("date").min = iso(t);
  if (MAX_DAYS > 0) $("date").max = iso(new Date(t.getTime() + MAX_DAYS * 86400000));
  $("date").value = iso(t);
  $("date").addEventListener("change", refresh);
}

function buildRows() {
  var html = "";
  SHIFTS.forEach(function (s) {
    html +=
      '<div class="row" data-id="' + esc(s.id) + '">' +
        '<div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" ' +
        'stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '<span class="nm">' + esc(s.name) + '</span>' +
        '<span class="tm">' + esc(s.time) + '</span>' +
      '</div>';
  });
  $("rows").innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll(".row"), function (el) {
    el.addEventListener("click", function () {
      var id = el.getAttribute("data-id");
      var i = picked.indexOf(id);
      if (i >= 0) { picked.splice(i, 1); el.classList.remove("on"); }
      else { picked.push(id); el.classList.add("on"); }
      refresh();
    });
  });

  $("toggleAll").addEventListener("click", function () {
    var all = (picked.length < SHIFTS.length);
    picked = all ? SHIFTS.map(function (s) { return s.id; }) : [];
    Array.prototype.forEach.call(document.querySelectorAll(".row"), function (el) {
      el.classList.toggle("on", all);
    });
    refresh();
  });
}

function refresh() {
  $("toggleAll").textContent = (picked.length < SHIFTS.length) ? "Chọn tất cả" : "Bỏ chọn hết";
  $("cnt").innerHTML = picked.length
    ? "Đã chọn <b>" + picked.length + "</b> ca"
    : '<span style="color:#B0B4BA">Chưa chọn ca nào</span>';
  $("submit").disabled = !($("date").value && (tab === "off" || picked.length > 0));
}

function bindTabs() {
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
    b.addEventListener("click", function () { setTab(b.getAttribute("data-tab")); });
  });
  $("submit").addEventListener("click", submit);
}

function setTab(t) {
  tab = t;
  hideErr();
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
    b.classList.toggle("on", b.getAttribute("data-tab") === t);
  });

  var isHist = (t === "hist");
  $("formView").classList.toggle("hide", isHist);
  $("histView").classList.toggle("hide", !isHist);
  $("foot").classList.toggle("hide", isHist);
  if (isHist) { loadHistory(); return; }

  var isOff = (t === "off");
  $("shiftSec").classList.toggle("hide", isOff);
  $("dateLbl").textContent = isOff ? "Ngày xin nghỉ" : "Ngày làm việc";
  $("reasonLbl").innerHTML = (isOff ? "Lý do nghỉ" : "Ghi chú") +
    ' <span style="text-transform:none;font-weight:400">(không bắt buộc)</span>';
  $("reason").placeholder = isOff
    ? "Ví dụ: việc gia đình, khám sức khoẻ…"
    : "Ví dụ: chỉ làm được nửa ca 3…";
  $("submit").textContent = isOff ? "Gửi đơn xin OFF" : "Gửi yêu cầu đăng ký";
  refresh();
}

/* ==================== GỬI ==================== */

function submit() {
  hideErr();
  $("submit").disabled = true;
  $("submit").textContent = "Đang gửi…";

  api("submit", {
    idToken: idToken,
    mode: tab,
    date: $("date").value,
    shifts: picked,
    reason: $("reason").value.trim()
  })
    .then(function (r) {
      if (r && r.ok) { showDone(r); return; }
      showErr((r && r.error) || "Gửi không thành công.");
      setTab(tab);
    })
    .catch(function (e) {
      showErr("Lỗi kết nối: " + e.message);
      setTab(tab);
    });
}

function showDone(r) {
  $("app").classList.add("hide");
  $("done").style.display = "block";
  var d = $("date").value.split("-");
  $("doneMsg").textContent = (tab === "off")
    ? "Xin nghỉ ngày " + d[2] + "/" + d[1] + "/" + d[0]
    : "Đăng ký " + r.count + " ca ngày " + d[2] + "/" + d[1] + "/" + d[0];
  $("doneCode").textContent = r.reqId;
  setTimeout(function () { if (liff.isInClient()) liff.closeWindow(); }, 2200);
}

/* ==================== LỊCH SỬ ==================== */

function loadHistory() {
  if (histLoaded) return;
  api("history", { idToken: idToken })
    .then(renderHistory)
    .catch(function () {
      $("histBody").innerHTML = '<div class="empty">Không tải được dữ liệu.</div>';
    });
}

function renderHistory(r) {
  histLoaded = true;
  if (!r || !r.ok) {
    $("histBody").innerHTML = '<div class="empty">' + esc((r && r.error) || "Lỗi") + '</div>';
    return;
  }
  if (!r.groups.length) {
    $("histBody").innerHTML = '<div class="empty">Chưa có yêu cầu nào.</div>';
    return;
  }

  var cls = { "Chờ duyệt": "p-w", "Đã duyệt": "p-o", "Từ chối": "p-n" };
  var html = "";

  r.groups.forEach(function (g) {
    html += '<div class="card"><h3>' + esc(g.date) + " — " + esc(g.type) + "</h3>" +
            '<div class="rid">' + esc(g.reqId) + "</div>";
    g.items.forEach(function (it) {
      var label = (it.shift && it.shift !== "-") ? it.shift : "Cả ngày";
      html += '<div class="it"><span>' + esc(label) + '</span>' +
              '<span class="pill ' + (cls[it.status] || "p-w") + '" style="margin-left:auto">' +
              esc(it.status) + "</span></div>";
      if (it.note) html += '<div class="note">↳ ' + esc(it.note) + "</div>";
    });
    html += "</div>";
  });

  $("histBody").innerHTML = html;
}

/* ==================== TIỆN ÍCH ==================== */

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function showErr(m) { $("err").textContent = m; $("err").style.display = "block"; window.scrollTo(0, 0); }
function hideErr() { $("err").style.display = "none"; }
